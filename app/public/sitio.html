<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Propiedades</title>
<style>:root{--bg:#f7f8fa;--ink:#1c2733;--mut:#64748b;--card:#fff;--line:#e2e8f0;--pri:#1d4ed8}@media(prefers-color-scheme:dark){:root{--bg:#0b1220;--ink:#e6edf6;--mut:#93a4ba;--card:#111b2e;--line:#22314a;--pri:#4f8bff}}
body{margin:0;font:15px/1.5 system-ui,sans-serif;background:var(--bg);color:var(--ink)}header{padding:20px 5vw;background:var(--card);border-bottom:1px solid var(--line)}h1{margin:0;font-size:22px}main{padding:18px 5vw}
.f{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}select,input,textarea,button{font:inherit;padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink)}button{background:var(--pri);color:#fff;border:0;cursor:pointer}
.g{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}.c{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;cursor:pointer}.c img{width:100%;height:180px;object-fit:cover;background:#dfe7ee}.c div{padding:12px}
.p{font-size:20px;font-weight:700}.m{color:var(--mut);font-size:13px}dialog{max-width:560px;width:92%;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink)}dialog img{width:100%;border-radius:8px}label{display:block;margin:8px 0 3px;font-size:13px;color:var(--mut)}dialog input,dialog textarea{width:100%;box-sizing:border-box}.hp{position:absolute;left:-9999px}</style></head>
<body><header><h1 id="t">Propiedades</h1></header><main><div class="f"><select id="op"><option value="">Venta y arriendo</option><option value="venta">Venta</option><option value="arriendo">Arriendo</option></select><input id="co" placeholder="Comuna"><select id="dm"><option value="">Dormitorios</option><option>1</option><option>2</option><option>3</option><option>4</option></select><button id="bs">Buscar</button></div><div class="g" id="g"></div></main>
<dialog id="d"></dialog>
<script src="/js/sitio.js"></script></body></html>
